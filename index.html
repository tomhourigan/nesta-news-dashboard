<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nesta | News Dashboard</title>
    <!-- Pulling in Inter, a font very close to Nesta's clean, geometric brand font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --nesta-dark: #0B0C10;
            --bg-light: #F4F5F7;
            --fairer-start: #FF5A36;     /* Vibrant Coral/Orange */
            --healthy-life: #00C8FF;     /* Bright Cyan */
            --sustainable: #00E59B;      /* Vibrant Green */
            --text-dark: #1A1A1A;
            --text-gray: #666666;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
        }

        /* Top Header Styling */
        header {
            background-color: var(--nesta-dark);
            color: #FFFFFF;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 3rem;
        }

        .brand-area {
            display: flex;
            flex-direction: column;
        }

        .nesta-logo {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            margin: 0;
            line-height: 1;
        }

        .dashboard-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #A0A0A0;
            margin-top: 8px;
            font-weight: 600;
        }

        .time-area {
            text-align: right;
        }

        #time {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        #date {
            font-size: 0.95rem;
            color: #A0A0A0;
        }

        /* Mission Columns Layout */
        main {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            padding: 2rem 3rem;
            min-height: 80vh;
        }

        .mission-col {
            background: #FFFFFF;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .mission-header {
            padding: 1.5rem;
            font-size: 1.4rem;
            font-weight: 800;
            background: #FFFFFF;
            margin: 0;
            border-bottom: 2px solid #EEE;
        }

        /* Dynamic Brand Accents for each mission */
        #col-fairer .mission-header { border-top: 6px solid var(--fairer-start); }
        #col-healthy .mission-header { border-top: 6px solid var(--healthy-life); }
        #col-sustainable .mission-header { border-top: 6px solid var(--sustainable); }

        .feed-container {
            padding: 0 1.5rem;
            overflow-y: auto;
            flex-grow: 1;
        }

        /* News Card Styling */
        .news-card {
            border-bottom: 1px solid #EAEAEA;
            padding: 1.25rem 0;
        }

        .news-card:last-child {
            border-bottom: none;
        }

        .meta-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            margin-bottom: 8px;
        }

        .source-badge {
            background-color: var(--nesta-dark);
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .date-text {
            color: var(--text-gray);
            font-weight: 600;
        }

        .news-card h4 {
            margin: 0;
            font-size: 1.05rem;
            line-height: 1.4;
            font-weight: 600;
        }

        .news-card a {
            text-decoration: none;
            color: var(--text-dark);
            transition: color 0.2s;
        }

        .news-card a:hover {
            color: #0055FF; /* Hover link colour */
        }

        .empty-state {
            padding: 2rem 0;
            text-align: center;
            color: var(--text-gray);
            font-size: 0.9rem;
            font-style: italic;
        }
        
        /* Mobile Responsiveness */
        @media (max-width: 900px) {
            main { grid-template-columns: 1fr; }
            header { flex-direction: column; align-items: flex-start; gap: 1rem; }
            .time-area { text-align: left; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-area">
            <div class="nesta-logo">nesta</div>
            <div class="dashboard-title">Comms News Dashboard</div>
        </div>
        <div class="time-area">
            <div id="time">Loading...</div>
            <div id="date">Loading...</div>
        </div>
    </header>
    
    <main>
        <!-- Mission 1 -->
        <section class="mission-col" id="col-fairer">
            <h3 class="mission-header">A Fairer Start</h3>
            <div class="feed-container" id="feed-fairer"></div>
        </section>

        <!-- Mission 2 -->
        <section class="mission-col" id="col-healthy">
            <h3 class="mission-header">A Healthy Life</h3>
            <div class="feed-container" id="feed-healthy"></div>
        </section>

        <!-- Mission 3 -->
        <section class="mission-col" id="col-sustainable">
            <h3 class="mission-header">A Sustainable Future</h3>
            <div class="feed-container" id="feed-sustainable"></div>
        </section>
    </main>

    <script>
        // --- 1. CLOCK CONFIGURATION ---
        function updateClock() {
            const now = new Date();
            document.getElementById('date').textContent = now.toLocaleDateString('en-GB', { 
                weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', timeZone: 'Europe/London' 
            });
            document.getElementById('time').textContent = now.toLocaleTimeString('en-GB', { 
                hour: '2-digit', minute: '2-digit', second: '2-digit', timeZone: 'Europe/London' 
            }) + ' (UK)';
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- 2. RSS FEEDS CONFIGURATION ---
        // Add your RSS.app / OpenRSS URLs here replacing the placeholders
        const rssSources = [
            { name: "BBC News", url: "http://feeds.bbci.co.uk/news/uk/rss.xml" },
            { name: "Sky News", url: "https://feeds.skynews.com/feeds/rss/home.xml" },
            { name: "The Guardian", url: "https://www.theguardian.com/uk/rss" },
            { name: "The Observer", url: "https://www.theguardian.com/observer/rss" },
            { name: "The Telegraph", url: "https://www.telegraph.co.uk/rss.xml" },
            // { name: "ITV News", url: "PASTE_RSS_APP_LINK_HERE" },
            // { name: "Channel 4", url: "PASTE_RSS_APP_LINK_HERE" },
            // { name: "LBC", url: "PASTE_RSS_APP_LINK_HERE" },
            // { name: "The Times", url: "PASTE_RSS_APP_LINK_HERE" },
            // { name: "The i", url: "PASTE_RSS_APP_LINK_HERE" },
            // { name: "The Economist", url: "PASTE_RSS_APP_LINK_HERE" },
            // { name: "New Statesman", url: "PASTE_RSS_APP_LINK_HERE" },
            // { name: "The Spectator", url: "PASTE_RSS_APP_LINK_HERE" }
        ];

        // --- 3. FILTERING KEYWORDS ---
        // Edit these lists to tweak what gets captured by each column
        const keywords = {
            fairer: ["early years", "education", "childcare", "school", "schools", "nursery", "pupil", "pupils", "teacher", "teachers", "child poverty", "university", "universities", "ofsted", "tuition", "a-level", "gcse"],
            healthy: ["health", "obesity", "glp1", "glp-1", "wegovy", "ozempic", "weight", "weight-loss", "nhs", "diet", "nutrition", "sugar tax", "junk food", "calorie", "calories", "diabetes", "mounjaro", "public health"],
            sustainable: ["climate", "climate change", "sustainability", "sustainable", "net zero", "net-zero", "emissions", "carbon", "green energy", "fossil fuels", "global warming", "environment", "pollution", "heat pump", "wind farm", "solar power", "cop28", "cop29", "renewable"]
        };

        // Create boundary regexes to match whole words and prevent false positives
        const regFairer = new RegExp("\\b(" + keywords.fairer.join("|") + ")\\b", "i");
        const regHealthy = new RegExp("\\b(" + keywords.healthy.join("|") + ")\\b", "i");
        const regSustainable = new RegExp("\\b(" + keywords.sustainable.join("|") + ")\\b", "i");

        // --- 4. FETCH AND DISTRIBUTE NEWS ---
        async function fetchNews() {
            console.log("Fetching latest news...");
            let allStories = [];

            // Fetch all feeds simultaneously 
            const fetchPromises = rssSources.map(async (source) => {
                try {
                    // Use allorigins to bypass CORS. The Date.now() timestamp forces it to fetch fresh data every time.
                    const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(source.url)}&t=${Date.now()}`;
                    const response = await fetch(proxyUrl);
                    const xmlText = await response.text();
                    
                    const parser = new DOMParser();
                    const xmlDoc = parser.parseFromString(xmlText, "text/xml");
                    const items = xmlDoc.querySelectorAll("item");
                    
                    items.forEach(item => {
                        const title = item.querySelector("title")?.textContent || "";
                        const link = item.querySelector("link")?.textContent || "";
                        const description = item.querySelector("description")?.textContent || "";
                        const pubDateStr = (item.querySelector("pubDate") || item.getElementsByTagNameNS("*", "date")[0])?.textContent || "";
                        
                        const searchText = (title + " " + description).toLowerCase();
                        let targetMission = null;
                        
                        // Check which mission matches the text
                        if (regFairer.test(searchText)) targetMission = "fairer";
                        else if (regHealthy.test(searchText)) targetMission = "healthy";
                        else if (regSustainable.test(searchText)) targetMission = "sustainable";
                        
                        if (targetMission) {
                            allStories.push({
                                title, link, source: source.name, targetMission, 
                                timestamp: new Date(pubDateStr).getTime() || Date.now()
                            });
                        }
                    });
                } catch (error) {
                    console.error(`Error fetching ${source.name}:`, error);
                }
            });

            await Promise.all(fetchPromises);
            
            // Sort stories by newest timestamp first
            allStories.sort((a, b) => b.timestamp - a.timestamp);
            
            // Clear current UI columns
            document.getElementById("feed-fairer").innerHTML = "";
            document.getElementById("feed-healthy").innerHTML = "";
            document.getElementById("feed-sustainable").innerHTML = "";
            
            let counts = { fairer: 0, healthy: 0, sustainable: 0 };

            // Render stories into the DOM
            allStories.forEach(story => {
                const div = document.createElement("div");
                div.className = "news-card";
                
                const timeStr = new Date(story.timestamp).toLocaleString("en-GB", {
                   hour: '2-digit', minute:'2-digit', day:'numeric', month:'short' 
                });

                div.innerHTML = `
                    <div class="meta-info">
                        <span class="source-badge">${story.source}</span>
                        <span class="date-text">${timeStr}</span>
                    </div>
                    <h4><a href="${story.link}" target="_blank">${story.title}</a></h4>
                `;
                document.getElementById(`feed-${story.targetMission}`).appendChild(div);
                counts[story.targetMission]++;
            });

            // Handle empty columns if no news matches the keywords right now
            ["fairer", "healthy", "sustainable"].forEach(mission => {
                if(counts[mission] === 0) {
                    document.getElementById(`feed-${mission}`).innerHTML = 
                        `<div class="empty-state">No recent stories found for this mission. Will check again in 5 mins.</div>`;
                }
            });
        }

        // Fetch immediately on load, then set an interval for exactly 5 minutes (300,000 milliseconds)
        fetchNews();
        setInterval(fetchNews, 300000);

    </script>
</body>
</html>
